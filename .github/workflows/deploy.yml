name: CI / Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autobot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/autobot_test
      SESSION_SECRET: ci_secret_for_testing_only
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck libs
        run: pnpm run typecheck:libs

      - name: Build dashboard
        run: BASE_PATH=/ pnpm --filter @workspace/bot-dashboard run build

      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

      - name: Push DB schema
        run: pnpm --filter @workspace/db run push
        continue-on-error: true

      - name: Health check (start server briefly)
        run: |
          node artifacts/api-server/dist/index.mjs &
          SERVER_PID=$!
          sleep 5
          curl -f http://localhost:8080/api/healthz || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID
        env:
          PORT: 8080
